<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>ForYou Cafe - Coming Soon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
    }

    /* ===== FULL-SCREEN APP FRAME ===== */
    .app-screen {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
      overflow: hidden;
    }

    /* Decorative background circles */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.08) 0%, transparent 70%);
      z-index: 0;
    }
    .bg-circle.top {
      width: 300px;
      height: 300px;
      top: -100px;
      right: -100px;
    }
    .bg-circle.bottom {
      width: 400px;
      height: 400px;
      bottom: -150px;
      left: -150px;
    }

    /* ===== MAIN CONTENT ===== */
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* Clean, professional logo container */
    .logo-wrapper {
      width: 170px;
      height: 170px;
      border-radius: 36px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2.5rem;
      border: 1.5px solid rgba(255, 215, 0, 0.5);
      box-shadow: 0 15px 35px -10px rgba(255, 215, 0, 0.25);
      animation: logoBreathe 4s ease-in-out infinite;
    }

    .logo-wrapper img {
      width: 140px;
      height: 140px;
      object-fit: contain;
    }

    @keyframes logoBreathe {
      0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 15px 35px -10px rgba(255, 215, 0, 0.25); }
      50%      { transform: translateY(-6px) scale(1.02); box-shadow: 0 20px 40px -10px rgba(255, 215, 0, 0.4); }
    }

    /* Status Pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fffdf0;
      border: 1.5px solid #ffd700;
      padding: 0.5rem 1.2rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #b8860b;
      margin-bottom: 1.5rem;
      animation: fadeInUp 0.8s ease 0.2s both;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7);
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%   { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
      70%  { box-shadow: 0 0 0 8px rgba(255, 215, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
    }

    /* Main Text */
    .title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #111111;
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 1rem;
      animation: fadeInUp 0.8s ease 0.35s both;
    }

    .subtitle {
      font-size: 0.95rem;
      font-weight: 500;
      color: #666666;
      line-height: 1.6;
      max-width: 320px;
      margin-bottom: 2.5rem;
      animation: fadeInUp 0.8s ease 0.5s both;
    }

    .subtitle strong {
      color: #b8860b;
      font-weight: 700;
    }

    /* Divider Line */
    .divider {
      width: 60px;
      height: 3px;
      background: #ffd700;
      border-radius: 10px;
      margin-bottom: 2rem;
      animation: fadeInUp 0.8s ease 0.6s both;
    }

    /* Footer Info */
    .footer-info {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      text-align: center;
      animation: fadeInUp 0.8s ease 1s both;
    }

    .footer-info p {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #bbbbbb;
      text-transform: uppercase;
    }

    @keyframes fadeInUp {
      0%   { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Small loader animation at the bottom of text */
    .loader-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 3rem;
      animation: fadeInUp 0.8s ease 0.7s both;
    }

    .loader-dots span {
      width: 6px;
      height: 6px;
      background: #ffd700;
      border-radius: 50%;
      animation: dotPulse 1.4s infinite ease-in-out both;
    }

    .loader-dots span:nth-child(1) { animation-delay: -0.32s; }
    .loader-dots span:nth-child(2) { animation-delay: -0.16s; }
    .loader-dots span:nth-child(3) { animation-delay: 0s; }

    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40%           { opacity: 1; transform: scale(1.1); }
    }

  </style>
</head>
<body>

  <div class="app-screen">
    <!-- Decorative Background -->
    <div class="bg-circle top"></div>
    <div class="bg-circle bottom"></div>

    <div class="content">
      
      <!-- Logo -->
      <div class="logo-wrapper">
        <img src="4.png" alt="ForYou Cafe Logo"
             onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23ffd700%22/><circle cx=%2250%22 cy=%2250%22 r=%2230%22 fill=%22%23ffffff%22/><circle cx=%2240%22 cy=%2245%22 r=%225%22 fill=%22%23ffd700%22/><circle cx=%2260%22 cy=%2245%22 r=%225%22 fill=%22%23ffd700%22/><path d=%22M42 60 Q50 70 58 60%22 stroke=%22%23ffd700%22 stroke-width=%224%22 fill=%22none%22 stroke-linecap=%22round%22/></svg>'">
      </div>

      <!-- Status Badge -->
      <div class="status-pill">
        <span class="status-dot"></span>
        Coming Soon
      </div>

      <!-- Main Text -->
      <h1 class="title">We're Crafting<br>Something Delicious</h1>
      
      <p class="subtitle">
        The <strong>ForYou Cafe</strong> app is currently in development. 
        We are working hard to bring the best Pizza & Burgers right to your fingertips. 
        Stay tuned!
      </p>

      <div class="divider"></div>

      <!-- Loading Dots -->
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>

    </div>

    <!-- Footer -->
    <div class="footer-info">
      <p>ForYou Cafe · Sadhoke</p>
    </div>

  </div>

</body>
</html>
